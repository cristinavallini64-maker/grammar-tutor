<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Framework — Monitoraggio accessi</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1628; --panel:rgba(255,255,255,0.05); --panel-2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.14); --text:#ffffff; --dim:rgba(255,255,255,0.72);
  --muted:rgba(255,255,255,0.42); --cyan:#00f0ff; --green:#00ff88; --gold:#ffcc00;
  --red:#ff4d6d; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:16px;
  background:linear-gradient(160deg,#060d1e 0%,#0e1a3a 45%,#0a1226 100%); padding:0;
}
a{color:var(--cyan);}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}

/* ---- header ---- */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
.brand h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:24px;letter-spacing:3px;
  background:linear-gradient(135deg,#00f0ff,#ffffff 60%,#00ff88);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;}
.brand p{color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.hdr-actions{display:flex;gap:10px;align-items:center;}
.btn{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;
  padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--text);cursor:pointer;transition:all .2s;}
.btn:hover{border-color:var(--cyan);color:var(--cyan);}
.btn.ghost{background:transparent;}
.btn.danger{border-color:rgba(255,77,109,.4);color:var(--red);background:rgba(255,77,109,.08);}
.btn.danger:hover{border-color:var(--red);background:rgba(255,77,109,.18);color:var(--red);}
.del-student{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;color:var(--red);
  background:transparent;border:1px solid rgba(255,77,109,.35);border-radius:8px;
  padding:5px 12px;cursor:pointer;margin-bottom:12px;transition:all .2s;}
.del-student:hover{background:rgba(255,77,109,.15);border-color:var(--red);}
.divider{height:2px;border-radius:2px;margin:14px 0 22px;
  background:linear-gradient(90deg,var(--cyan),transparent 70%);opacity:.7;}

/* ---- login gate ---- */
.gate{max-width:380px;margin:14vh auto 0;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:30px 26px;backdrop-filter:blur(12px);}
.gate h2{font-family:'Orbitron',sans-serif;font-size:16px;letter-spacing:2px;margin-bottom:6px;}
.gate p{color:var(--dim);font-size:14px;margin-bottom:18px;}
.field{display:flex;flex-direction:column;gap:8px;}
input[type=password],input[type=text]{font-family:'Rajdhani',sans-serif;font-size:16px;
  padding:11px 14px;border-radius:10px;border:1px solid var(--border);
  background:rgba(0,0,0,.35);color:var(--text);outline:none;}
input:focus{border-color:var(--cyan);}
.btn.primary{background:var(--cyan);color:#04121f;border-color:var(--cyan);font-weight:700;}
.btn.primary:hover{background:#fff;color:#04121f;}
.gate .btn.primary{width:100%;margin-top:16px;padding:12px;}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:1.1em;}

/* ---- stats ---- */
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.stat{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;}
.stat .n{font-family:'Orbitron',sans-serif;font-weight:700;font-size:28px;color:var(--cyan);}
.stat .l{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}

/* ---- search ---- */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar input{flex:1;min-width:220px;}
.count{color:var(--muted);font-size:13px;}

/* ---- table ---- */
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;}
.tbl th{font-family:'Orbitron',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);text-align:left;padding:13px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;}
.tbl th:hover{color:var(--cyan);}
.tbl th.sorted::after{content:' \25BC';font-size:9px;}
.tbl th.sorted.asc::after{content:' \25B2';}
.tbl td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px;}
.row-main{cursor:pointer;transition:background .15s;}
.row-main:hover{background:rgba(0,240,255,.05);}
.email{font-weight:600;}
.email .caret{color:var(--muted);margin-right:8px;font-size:11px;display:inline-block;width:10px;transition:transform .2s;}
.row-main.open .caret{transform:rotate(90deg);color:var(--cyan);}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.detail td{padding:0;border-bottom:1px solid rgba(255,255,255,.06);}
.detail-inner{padding:6px 16px 14px 42px;}
.subtbl{width:100%;border-collapse:collapse;}
.subtbl th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  text-align:left;padding:8px 12px;font-family:'Orbitron',sans-serif;font-weight:600;cursor:default;}
.subtbl th:hover{color:var(--muted);}
.subtbl td{padding:8px 12px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;}
.pill.good{background:rgba(0,255,136,.15);color:var(--green);}
.pill.mid{background:rgba(255,204,0,.15);color:var(--gold);}
.pill.low{background:rgba(255,77,109,.15);color:var(--red);}
.pill.none{background:rgba(255,255,255,.08);color:var(--muted);}
.lvls{display:flex;flex-direction:column;gap:6px;}
/* dettaglio studente: una scheda per pagina */
.pcard{border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:10px 0;background:rgba(255,255,255,.02);}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;}
.pname{font-weight:800;font-size:15px;color:var(--text);}
.pstats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--dim);margin-top:6px;}
.pstats b{color:var(--text);font-weight:700;}
.rtbl{width:100%;border-collapse:collapse;margin-top:10px;}
.rtbl th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}
.rtbl td{padding:6px 10px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;}
.rtbl tr.grp td{font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding-top:12px;border-bottom:none;}
.rtbl td.sc{white-space:nowrap;}
.warn{color:#ff3b3b;font-weight:800;margin-left:6px;cursor:help;}
.lvl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);}

/* ---- sections ---- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.tab{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;padding:9px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--panel);color:var(--dim);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:8px;}
.tab:hover{border-color:var(--sc,var(--cyan));color:var(--text);}
.tab.on{background:var(--sc,var(--cyan));border-color:var(--sc,var(--cyan));color:#04121f;}
.tab .dot{width:10px;height:10px;border-radius:50%;background:var(--sc,var(--cyan));}
.tab.on .dot{background:#04121f;}
.tab .k{font-size:12px;opacity:.75;}
.sec-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;
  color:#04121f;background:var(--sc,var(--muted));white-space:nowrap;}
.sec-title{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:1.5px;margin:-6px 0 16px;color:var(--sc,var(--cyan));}

.empty{text-align:center;color:var(--dim);padding:50px 20px;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius);}
.empty strong{display:block;font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:1px;margin-bottom:8px;color:var(--text);}

@media(max-width:600px){
  .tbl .hide-sm{display:none;}
  .stat .n{font-size:22px;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="gate" class="gate">
    <h2>Monitoraggio accessi</h2>
    <p>Inserisci la password per vedere i dati.</p>
    <div class="field">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    </div>
    <button class="btn primary" onclick="login()">Apri</button>
    <div id="gateErr" class="err"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="app" style="display:none;">
    <header>
      <div class="brand">
        <h1>ENGLISH FRAMEWORK</h1>
        <p>Monitoraggio accessi studenti</p>
      </div>
      <div class="hdr-actions">
        <button class="btn ghost" onclick="reload()">&#x21BB; Aggiorna</button>
        <button class="btn danger" onclick="wipeAll()">Azzera tutto</button>
        <button class="btn ghost" onclick="logout()">Esci</button>
      </div>
    </header>
    <div class="divider"></div>

    <div class="tabs" id="tabs"></div>
    <div class="sec-title" id="secTitle"></div>

    <div class="stats">
      <div class="stat"><div class="n" id="stStudents">0</div><div class="l">Studenti</div></div>
      <div class="stat"><div class="n" id="stOpens">0</div><div class="l">Aperture totali</div></div>
      <div class="stat"><div class="n" id="stTime">0</div><div class="l">Tempo totale</div></div>
    </div>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Cerca uno studente per email..." oninput="render()">
      <span class="count" id="count"></span>
    </div>

    <div id="tableHost"></div>
  </div>

</div>

<script>
const WORKER_URL = "https://tracker.cristinavallini64.workers.dev";
let PW = null;
let DATA = { byStudent: [], byPage: [], byLevel: [] };
let sortKey = "last_seen", sortAsc = false;
const openRows = new Set();

function login(){
  const pw = document.getElementById('pw').value.trim();
  if(!pw){ document.getElementById('gateErr').textContent = "Scrivi la password."; return; }
  PW = pw;
  fetchData(true);
}
function logout(){
  PW = null; DATA = { byStudent:[], byPage:[] }; openRows.clear();
  document.getElementById('app').style.display = "none";
  document.getElementById('gate').style.display = "block";
  document.getElementById('pw').value = "";
}
function reload(){ fetchData(false); }

function wipeAll(){
  if(!confirm("Azzerare TUTTI i dati di tutti gli studenti? L'operazione non \u00e8 reversibile.")) return;
  const pw = prompt("Per conferma, ridigita la password:");
  if(pw === null || pw === "") return;
  fetch(WORKER_URL + "/delete", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key: pw })
  }).then(r => r.json()).then(d => {
    if(d && d.ok){ openRows.clear(); reload(); }
    else alert((d && d.error) || "Errore.");
  }).catch(() => alert("Errore di rete."));
}

function deleteStudent(email){
  if(!confirm("Eliminare tutti i dati di " + email + "?\nL'operazione non \u00e8 reversibile.")) return;
  fetch(WORKER_URL + "/delete", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key: PW, email: email })
  }).then(r => r.json()).then(d => {
    if(d && d.ok){ openRows.delete(email); reload(); }
    else alert((d && d.error) || "Errore.");
  }).catch(() => alert("Errore di rete."));
}

function fetchData(fromGate){
  fetch(WORKER_URL + "/report?key=" + encodeURIComponent(PW))
    .then(r => r.json())
    .then(d => {
      if(!d || !d.ok){
        const msg = (d && d.error) || "Errore.";
        if(fromGate){ document.getElementById('gateErr').textContent = msg; PW = null; }
        else alert(msg);
        return;
      }
      DATA = { byStudent: d.byStudent || [], byPage: d.byPage || [], byLevel: d.byLevel || [] };
      document.getElementById('gate').style.display = "none";
      document.getElementById('app').style.display = "block";
      (Object.keys(FILES).length ? Promise.resolve() : loadSectionFiles()).then(render);
    })
    .catch(() => {
      const msg = "Impossibile contattare il server. Controlla la connessione.";
      if(fromGate){ document.getElementById('gateErr').textContent = msg; PW = null; }
      else alert(msg);
    });
}


/* ---- Sezioni ----
   Ogni sezione e' un sito (repository GitHub). La sezione di una pagina si riconosce
   dal nome del file, cercandolo nell'elenco dei file di ciascun sito (letto da GitHub
   all'apertura del pannello; se GitHub non risponde si usa l'elenco qui sotto).
   Per aggiungere una sezione: aggiungi una riga in SECTIONS. */
const SECTIONS = [
  { repo: "grammar-tutor",     name: "Grammar Quest",     color: "#00f0ff" },
  { repo: "structure",         name: "The Structure",     color: "#ffcc00" },
  { repo: "technical-english", name: "Technical English", color: "#00ff88" },
  { repo: "final-inspection",  name: "Final Inspection",  color: "#7dff4d" }
];
const OTHER = { repo: "_altro", name: "Altre pagine", color: "#b9a6ff" };
const FALLBACK_FILES = {
  "grammar-tutor": ["defining-relatives.html", "food-quantity.html", "lessico-starter-abc.html", "lessico-starter-def.html", "lessico-u1.html", "lessico-u10.html", "lessico-u2.html", "lessico-u3.html", "lessico-u4.html", "lessico-u5.html", "lessico-u6.html", "lessico-u7.html", "lessico-u8.html", "lessico-u9.html", "past-simple.html", "present-continuous.html", "present-perfect.html", "present-simple.html", "speaking-tutor-a2.html", "speaking-tutor-b1.html", "starter1.html", "starter2.html", "unit10friends.html", "unit5.html", "unit6.html", "unit7.html", "unit8tomorrow.html"],
  "structure": ["cambridge-u1.html", "cambridge-u10.html", "cambridge-u2.html", "cambridge-u3.html", "cambridge-u4.html", "cambridge-u5.html", "cambridge-u6.html", "cambridge-u7.html", "cambridge-u8.html", "cambridge-u9.html", "first-conditional.html", "modal-deduction.html", "modals-advice.html", "passive-voice.html", "past-narrative.html", "past-perfect-relatives.html", "present-perfect-advanced.html", "reported-speech.html", "second-conditional.html", "sentence-transformation-tutor.html", "speaking-b2-l1.html", "speaking-b2-l2.html", "studia-u1-index.html", "studia-u10-index.html", "studia-u2-index.html", "studia-u3-index.html", "studia-u4-index.html", "studia-u5-index.html", "studia-u6-index.html", "studia-u7-index.html", "studia-u8-index.html", "studia-u9-index.html", "tutor-spiega.html", "verb-patterns.html", "word-formation-tutor.html"],
  "technical-english": ["index.html", "renewable-energy.html"],
  "final-inspection": ["b1-preliminary.html", "b2-first.html"]
};
const FILES = {};
let currentSec = "all";

function loadSectionFiles(){
  return Promise.all(SECTIONS.map(sec => {
    FILES[sec.repo] = new Set(FALLBACK_FILES[sec.repo] || []);
    return fetch("https://api.github.com/repos/cristinavallini64-maker/" + sec.repo + "/contents/")
      .then(r => r.ok ? r.json() : [])
      .then(list => { if (Array.isArray(list)) list.forEach(f => { if (f.type === "file") FILES[sec.repo].add(f.name); }); })
      .catch(() => {});
  }));
}
function sectionOf(page){
  page = page || "";
  if (page.indexOf("/") >= 0) {
    const repo = page.split("/")[0];
    if (SECTIONS.some(s => s.repo === repo)) return repo;
  }
  const file = page.split("/").pop();
  for (const sec of SECTIONS) if (FILES[sec.repo] && FILES[sec.repo].has(file)) return sec.repo;
  return OTHER.repo;
}
function secInfo(repo){ return SECTIONS.find(s => s.repo === repo) || OTHER; }
function setSection(repo){ currentSec = repo; openRows.clear(); render(); }

/* righe studente calcolate dalle sole pagine della sezione scelta */
function studentRowsFor(sec){
  if (sec === "all") return DATA.byStudent.slice();
  const m = {};
  DATA.byPage.filter(p => sectionOf(p.page) === sec).forEach(p => {
    const r = m[p.email] || (m[p.email] = { email: p.email, opens: 0, seconds: 0, leaves: 0, away_seconds: 0, first_seen: null, last_seen: null, _hasLeaves: false });
    r.opens += +p.opens || 0;
    r.seconds += +p.seconds || 0;
    if (p.leaves !== undefined && p.leaves !== null) { r._hasLeaves = true; r.leaves += +p.leaves || 0; r.away_seconds += +p.away_seconds || 0; }
    if (p.first_seen && (!r.first_seen || p.first_seen < r.first_seen)) r.first_seen = p.first_seen;
    if (p.last_seen && (!r.last_seen || p.last_seen > r.last_seen)) r.last_seen = p.last_seen;
  });
  return Object.values(m).map(r => { if (!r._hasLeaves) { r.leaves = null; r.away_seconds = null; } return r; });
}

function renderTabs(){
  const used = new Set(DATA.byPage.map(p => sectionOf(p.page)));
  const list = SECTIONS.concat(used.has(OTHER.repo) ? [OTHER] : []);
  const count = repo => new Set(DATA.byPage.filter(p => sectionOf(p.page) === repo).map(p => p.email)).size;
  document.getElementById("tabs").innerHTML =
    '<button class="tab' + (currentSec === "all" ? " on" : "") + '" onclick="setSection(\'all\')">Tutte le sezioni <span class="k">' + DATA.byStudent.length + '</span></button>' +
    list.map(s => '<button class="tab' + (currentSec === s.repo ? " on" : "") + '" style="--sc:' + s.color + '" onclick="setSection(\'' + s.repo + '\')"><span class="dot"></span>' + esc(s.name) + ' <span class="k">' + count(s.repo) + '</span></button>').join("");
  const t = document.getElementById("secTitle");
  if (currentSec === "all") { t.textContent = ""; t.style.display = "none"; }
  else { const s = secInfo(currentSec); t.textContent = s.name.toUpperCase(); t.style.setProperty("--sc", s.color); t.style.display = "block"; }
}

/* --- helpers --- */
function fmtTime(sec){
  sec = Math.round(sec || 0);
  if(sec < 60) return sec + "s";
  if(sec < 3600) return Math.floor(sec/60) + "m " + (sec%60) + "s";
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  return h + "h " + m + "m";
}
/* Uscite dalla pagina: numero + tempo passato fuori (dati dal Worker: leaves, away_seconds) */
function fmtLeaves(r){
  if(r.leaves === undefined || r.leaves === null) return '<span class="muted">—</span>';
  const n = +r.leaves || 0;
  if(!n) return '0';
  return n + ' <span class="muted">(' + fmtTime(+r.away_seconds || 0) + ' fuori)</span>';
}
function fmtDate(s){
  if(!s) return "—";
  const d = new Date(s.replace(" ","T") + "Z");      // il DB salva in UTC
  if(isNaN(d)) return s;
  return d.toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
/* Livelli con il totale nel nome, es. "LIVELLO 01 — USED TO (su 19)":
   mostra anche le risposte corrette (es. 17/19). */
function lvlCell(l){
  const m = /\s*\(su (\d+)\)\s*$/.exec(l.level || "");
  const tot = m ? +m[1] : 0, name = m ? l.level.slice(0, m.index) : (l.level || "");
  const frac = v => (tot && v !== null && v !== undefined) ? '<b>'+String(Math.round(v * tot / 50) / 2).replace('.', ',')+'/'+tot+'</b> ' : '';   // anche mezzi punti (es. 7,5/10)
  const n = +l.attempts || 1;
  const first = (l.first_score === undefined || l.first_score === null) ? null : +l.first_score;
  // un solo tentativo (o Worker vecchio): come prima
  if(n <= 1 || first === null) return '<span class="lvl">'+esc(name)+' '+frac(l.score)+scorePill(l.score)+'</span>';
  // piu' tentativi: primo tentativo (la misura vera) + migliore + quante volte
  const sospetto = first < 50 && l.score >= 80;
  return '<span class="lvl">'+esc(name)+' 1\u00b0: '+frac(first)+scorePill(first)+
    ' &rarr; migliore: '+frac(l.score)+scorePill(l.score)+
    ' <span class="muted">('+n+' volte)</span>'+
    (sospetto ? ' <span title="Primo tentativo basso e poi punteggio alto: potrebbe aver memorizzato le risposte" style="color:#e00000;font-weight:800">&#9888;</span>' : '')+
    '</span>';
}
function scorePill(v){
  if(v === null || v === undefined) return '<span class="pill none">—</span>';
  const cls = v >= 80 ? "good" : v >= 60 ? "mid" : "low";
  return '<span class="pill '+cls+'">'+Math.round(v)+'%</span>';
}
function setSort(k){
  if(sortKey === k) sortAsc = !sortAsc;
  else { sortKey = k; sortAsc = (k === "email"); }
  render();
}

function render(){
  const q = (document.getElementById('search').value || "").toLowerCase().trim();
  renderTabs();
  const allRows = studentRowsFor(currentSec);
  let rows = allRows.slice();
  if(q) rows = rows.filter(r => (r.email||"").toLowerCase().includes(q));

  rows.sort((a,b) => {
    let x = a[sortKey], y = b[sortKey];
    if(sortKey === "email" || sortKey === "last_seen" || sortKey === "first_seen"){ x = (x||""); y = (y||""); return sortAsc ? (x<y?-1:x>y?1:0) : (x>y?-1:x<y?1:0); }
    x = +x||0; y = +y||0; return sortAsc ? x-y : y-x;
  });

  // stats (su tutti, non solo i filtrati)
  const totOpens = allRows.reduce((s,r)=>s+(+r.opens||0),0);
  const totSec   = allRows.reduce((s,r)=>s+(+r.seconds||0),0);
  document.getElementById('stStudents').textContent = allRows.length;
  document.getElementById('stOpens').textContent = totOpens;
  document.getElementById('stTime').textContent = fmtTime(totSec);
  document.getElementById('count').textContent = rows.length + " studenti mostrati";

  const host = document.getElementById('tableHost');

  if(currentSec !== "all" && allRows.length === 0){
    host.innerHTML = '<div class="empty"><strong>Nessun accesso in questa sezione</strong>Gli accessi compariranno qui quando gli studenti apriranno le pagine di questa sezione.</div>';
    return;
  }
  if(DATA.byStudent.length === 0){
    host.innerHTML = '<div class="empty"><strong>Nessun accesso ancora registrato</strong>I dati compariranno qui non appena gli studenti accederanno alle pagine.</div>';
    return;
  }

  const arrow = k => 'class="'+(sortKey===k?'sorted '+(sortAsc?'asc':''):'')+'" onclick="setSort(\''+k+'\')"';

  let html = '<table class="tbl"><thead><tr>'+
    '<th '+arrow('email')+'>Studente</th>'+
    '<th '+arrow('opens')+'>Aperture</th>'+
    '<th class="hide-sm" '+arrow('seconds')+'>Tempo</th>'+
    '<th '+arrow('leaves')+' title="Quante volte ha lasciato la pagina (altra scheda, finestra o app) e per quanto tempo">Uscite</th>'+
    '<th class="hide-sm" '+arrow('first_seen')+'>Primo accesso</th>'+
    '<th '+arrow('last_seen')+'>Ultima attività</th>'+
    '</tr></thead><tbody>';

  rows.forEach(r => {
    const isOpen = openRows.has(r.email);
    html += '<tr class="row-main'+(isOpen?' open':'')+'" onclick="toggle(\''+escAttr(r.email)+'\')">'+
      '<td class="email"><span class="caret">&#9654;</span>'+esc(r.email)+'</td>'+
      '<td class="num">'+(r.opens||0)+'</td>'+
      '<td class="num hide-sm">'+fmtTime(r.seconds)+'</td>'+
      '<td class="num">'+fmtLeaves(r)+'</td>'+
      '<td class="muted hide-sm">'+fmtDate(r.first_seen)+'</td>'+
      '<td class="muted">'+fmtDate(r.last_seen)+'</td>'+
      '</tr>';
    if(isOpen) html += detailRow(r.email);
  });
  html += '</tbody></table>';
  host.innerHTML = html;
}

/* nomi leggibili delle pagine */
const PAGE_NAMES = {
  "b1-preliminary": "Test B1 Preliminary", "b2-first": "Test B2 First",
  "past-narrative": "Unit 1 · Esercitati", "present-perfect-advanced": "Unit 2 · Esercitati", "verb-patterns": "Unit 3 · Esercitati",
  "past-perfect-relatives": "Unit 4 · Esercitati", "first-conditional": "Unit 5 · Esercitati", "second-conditional": "Unit 6 · Esercitati",
  "modals-advice": "Unit 7 · Esercitati", "modal-deduction": "Unit 8 · Esercitati", "passive-voice": "Unit 9 · Esercitati", "reported-speech": "Unit 10 · Esercitati",
  "word-formation-tutor": "Word Formation", "sentence-transformation-tutor": "Sentence Transformation", "tutor-spiega": "Tutor Spiega"
};
function pageLabel(page){
  const f = (page || "").split("/").pop().replace(/\.html$/, "");
  if (PAGE_NAMES[f]) return PAGE_NAMES[f];
  let m = /^cambridge-u(\d+)$/.exec(f); if (m) return "Unit " + m[1] + " · Cambridge";
  m = /^studia-u(\d+)-index$/.exec(f); if (m) return "Unit " + m[1] + " · Studia";
  return f.replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
}
/* "Cambridge PET 3 · Test 1 · reading part 3 (su 10)" -> gruppo "Cambridge PET 3 · Test 1", voce "Reading part 3", totale 10 */
function splitLevel(level){
  let s = level || "", tot = 0;
  const m = /\s*\(su (\d+)\)\s*$/.exec(s); if (m) { tot = +m[1]; s = s.slice(0, m.index); }
  const parts = s.split(" · ");
  let group = "", item = s;
  if (parts.length >= 3) { group = parts.slice(0, -1).join(" · "); item = parts[parts.length - 1]; }
  item = item.replace(/^./, c => c.toUpperCase());
  return { group, item, tot };
}
function scoreTxt(v, tot){
  if (v === null || v === undefined) return '<span class="muted">—</span>';
  const n = tot ? '<b>' + String(Math.round(v * tot / 50) / 2).replace('.', ',') + '/' + tot + '</b> ' : '';
  return n + scorePill(v);
}
function resultsTable(levels){
  const isTest = levels.some(l => /^(b1-|b2-)/.test((l.page || '').split('/').pop()));
  const warnIco = '<span class="warn" title="Prima volta bassa e poi punteggio alto: potrebbe aver rifatto la parte dopo aver visto le soluzioni">&#9888;</span>';
  if (!isTest) {
    let h = '<table class="rtbl"><thead><tr><th>Parte / livello</th><th>Prima volta</th><th>Migliore</th><th>Volte</th></tr></thead><tbody>';
    let lastGroup = null;
    levels.forEach(l => {
      const sp = splitLevel(l.level);
      if (sp.group && sp.group !== lastGroup) { h += '<tr class="grp"><td colspan="4">' + esc(sp.group) + '</td></tr>'; lastGroup = sp.group; }
      const n = +l.attempts || 1;
      const first = (l.first_score === undefined || l.first_score === null) ? l.score : +l.first_score;
      h += '<tr><td>' + esc(sp.item) + '</td><td class="sc">' + scoreTxt(first, sp.tot) + '</td>' +
        '<td class="sc">' + (n > 1 ? scoreTxt(l.score, sp.tot) : '<span class="muted">—</span>') + '</td>' +
        '<td>' + n + (n > 1 && first < 50 && l.score >= 80 ? warnIco : '') + '</td></tr>';
    });
    return h + '</tbody></table>';
  }
  /* TEST: per ogni parte, i due tentativi della prima volta separati */
  const parts = {}, order = [];
  levels.forEach(l => {
    const m = /\s*\[(t1|t2)\]\s*(?=\(su \d+\)\s*$)/.exec(l.level || '');
    const base = m ? l.level.slice(0, m.index) + ' ' + l.level.slice(m.index + m[0].length) : l.level;
    const key = base.replace(/\s+/g, ' ').trim();
    if (!parts[key]) { parts[key] = {}; order.push(key); }
    parts[key][m ? m[1] : 'tot'] = l;
  });
  const fv = l => l ? ((l.first_score === undefined || l.first_score === null) ? l.score : +l.first_score) : null;
  let h = '<table class="rtbl"><thead><tr><th>Parte</th><th>1° tentativo</th><th>2° tentativo</th><th>Punteggio</th><th>Rifatta da capo</th></tr></thead><tbody>';
  let lastGroup = null;
  order.forEach(key => {
    const p = parts[key], sp = splitLevel(key);
    if (sp.group && sp.group !== lastGroup) { h += '<tr class="grp"><td colspan="5">' + esc(sp.group) + '</td></tr>'; lastGroup = sp.group; }
    const tot = p.tot, first = fv(tot), n = tot ? (+tot.attempts || 1) : 1;
    const dash = '<span class="muted">—</span>';
    let redo = 'no';
    if (n > 1) redo = (n - 1) + (n - 1 === 1 ? ' volta' : ' volte') + ' · migliore ' + scoreTxt(tot.score, sp.tot) + (first < 50 && tot.score >= 80 ? warnIco : '');
    h += '<tr><td>' + esc(sp.item) + '</td>' +
      '<td class="sc">' + (p.t1 ? scoreTxt(fv(p.t1), sp.tot) : dash) + '</td>' +
      '<td class="sc">' + (p.t2 ? scoreTxt(fv(p.t2), sp.tot) : dash) + '</td>' +
      '<td class="sc">' + (tot ? scoreTxt(first, sp.tot) : dash) + '</td>' +
      '<td>' + redo + '</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="pstats"><span><b>1° tentativo</b> = risposte giuste alla prima correzione · <b>2° tentativo</b> = risposte giuste dopo aver corretto le sbagliate (— se non c\'era niente da correggere o la parte non lo prevede) · <b>Punteggio</b> = 1 punto per le giuste subito + ½ per quelle corrette al 2° tentativo. I risultati fatti prima del 15/10 alle 12:30 non hanno i due tentativi separati.</span></div>';
  return h;
}
function detailRow(email){
  const pages = DATA.byPage.filter(p => p.email === email && (currentSec === "all" || sectionOf(p.page) === currentSec))
    .sort((a,b)=> (b.last_seen || "").localeCompare(a.last_seen || ""));
  let inner = '';
  if (pages.length === 0) inner = '<div class="muted">Nessun dettaglio.</div>';
  pages.forEach(p => {
    const levels = DATA.byLevel.filter(l => l.email === email && l.page === p.page);
    const si = secInfo(sectionOf(p.page));
    inner += '<div class="pcard"><div class="phead">' +
      '<span class="sec-tag" style="--sc:' + si.color + '">' + esc(si.name) + '</span>' +
      '<span class="pname">' + esc(pageLabel(p.page)) + '</span></div>' +
      '<div class="pstats">' +
        '<span>Aperture <b>' + (p.opens || 0) + '</b></span>' +
        '<span>Tempo <b>' + fmtTime(p.seconds) + '</b></span>' +
        '<span>Uscite <b>' + fmtLeaves(p) + '</b></span>' +
        '<span>Dal <b>' + fmtDate(p.first_seen) + '</b> al <b>' + fmtDate(p.last_seen) + '</b></span>' +
      '</div>' +
      (levels.length ? resultsTable(levels) : '<div class="pstats">Nessun punteggio (pagina senza punteggi o nessuna parte completata).</div>') +
      '</div>';
  });
  const delBtn = '<button class="del-student" onclick="deleteStudent(\''+escAttr(email)+'\')">&#x2715; Elimina i dati di questo studente</button>';
  return '<tr class="detail"><td colspan="6"><div class="detail-inner">'+delBtn+inner+'</div></td></tr>';
}

function toggle(email){
  if(openRows.has(email)) openRows.delete(email); else openRows.add(email);
  render();
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return esc(s).replace(/'/g,"\\'"); }

/* Invio per accedere */
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
</script>
