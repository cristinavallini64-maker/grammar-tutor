<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voci italiane</title>
<style>
body{font-family:sans-serif;background:#0e1a3a;color:#fff;max-width:720px;margin:0 auto;padding:16px;}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #234;}
.row b{flex:0 0 28px;color:#ffcc00;font-size:18px;}
.row span{flex:1;font:14px monospace;word-break:break-all;}
.row em{flex:0 0 90px;font-style:normal;font-size:13px;color:#aaa;}
button{font-size:15px;padding:8px 14px;border-radius:8px;border:1px solid #00f0ff;background:#123;color:#00f0ff;cursor:pointer;}
h3{margin-top:26px;color:#00f0ff;}
</style>
</head>
<body>
<h2>Voci del Chromebook</h2>
<p>Premi <b>▶</b> su ogni voce. Accanto compare se parte (✓) o resta bloccata (✗).<br>
Poi dimmi il <b>numero</b> della voce italiana e di quella inglese che suonano meglio.</p>
<h3>🇮🇹 Italiane</h3><div id="it">caricamento…</div>
<h3>🇬🇧 Inglesi</h3><div id="en">caricamento…</div>
<script>
const s = window.speechSynthesis;
const keep = [];
function draw(){
  const v = s ? s.getVoices() : [];
  [['it', /^it/i, 'Ciao, mi senti? Questa è una prova.'], ['en', /^en/i, 'Hello, can you hear me? This is a test.']].forEach(([id, re, txt]) => {
    const box = document.getElementById(id);
    const list = v.filter(x => re.test(x.lang));
    if (!list.length) { box.textContent = v.length ? 'nessuna' : 'caricamento…'; return; }
    box.innerHTML = '';
    list.forEach((x, i) => {
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<b>' + (i + 1) + '</b><span></span><em></em><button>▶</button>';
      r.querySelector('span').textContent = x.name + '  [' + x.lang + (x.localService ? ', locale' : ', online') + ']';
      const st = r.querySelector('em');
      r.querySelector('button').onclick = () => {
        s.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.voice = x; u.lang = x.lang;
        let ok = false;
        u.onstart = () => { ok = true; st.textContent = '✓ parte'; };
        u.onerror = e => { if (!ok) st.textContent = '✗ ' + e.error; };
        keep.push(u);
        s.speak(u);
        st.textContent = '…';
        setTimeout(() => { if (!ok) { st.textContent = '✗ bloccata'; s.cancel(); } }, 3000);
      };
      box.appendChild(r);
    });
  });
}
if (s) { draw(); s.onvoiceschanged = draw; } else document.body.insertAdjacentHTML('beforeend', '<p>Sintesi vocale non disponibile.</p>');
</script>
</body>
</html>
