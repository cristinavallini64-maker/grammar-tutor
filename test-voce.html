<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prova voce</title>
<style>
body{font-family:sans-serif;background:#0e1a3a;color:#fff;max-width:640px;margin:0 auto;padding:16px;}
button{font-size:16px;padding:10px 16px;margin:6px 6px 6px 0;border-radius:8px;border:1px solid #00f0ff;background:#123;color:#00f0ff;cursor:pointer;}
#log{background:#000;padding:10px;border-radius:8px;font:13px monospace;white-space:pre-wrap;min-height:120px;}
</style>
</head>
<body>
<h2>Prova voce</h2>
<p>Ricarica la pagina, premi <b>Prova italiano</b> e poi <b>Prova inglese</b>, e fai uno screenshot dell'<b>inizio</b> del riquadro nero.</p>
<button id="en">🔊 Prova inglese</button>
<button id="it">🔊 Prova italiano</button>
<button id="plain">🔊 Prova senza scegliere la voce</button>
<div id="log"></div>
<script>
const log = m => { document.getElementById('log').textContent += m + '\n'; };
const s = window.speechSynthesis;
log('Browser: ' + navigator.userAgent);
log('In una cornice (iframe): ' + (window.self !== window.top ? 'SÌ' : 'no'));
if (!s) log('⚠ speechSynthesis NON disponibile');
function listVoices(){
  if (!s) return;
  const v = s.getVoices();
  log('Voci totali: ' + v.length + ' — inglesi: ' + v.filter(x=>/^en/i.test(x.lang)).length + ' — italiane: ' + v.filter(x=>/^it/i.test(x.lang)).length);
  const it = v.filter(x=>/^it/i.test(x.lang)).map(x=>x.name.replace('Riconoscimento e sintesi vocale di Google','')+' ['+x.lang+']');
  const gb = v.filter(x=>/^en[-_]gb/i.test(x.lang)).map(x=>x.name.replace('Riconoscimento e sintesi vocale di Google','')+' ['+x.lang+']');
  const other = v.filter(x=>!/^(it|en)/i.test(x.lang)).length;
  log('ITALIANE: ' + (it.join(' | ') || 'nessuna'));
  log('BRITANNICHE: ' + (gb.join(' | ') || 'nessuna'));
  log('Nomi di tutte le inglesi: ' + v.filter(x=>/^en/i.test(x.lang)).map(x=>x.name.replace('Riconoscimento e sintesi vocale di Google','')).join(' | '));
  log('Altre lingue: ' + other);
}
listVoices();
if (s) s.onvoiceschanged = () => { log('— elenco voci aggiornato —'); listVoices(); };
const keep = [];
function say(text, lang, useVoice){
  if (!s) return;
  s.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    if (useVoice) {
      const v = s.getVoices().filter(x => x.lang.toLowerCase().startsWith(lang.slice(0,2)) && !/android/i.test(x.name));
      const pick = v.find(x => /chrome os|google/i.test(x.name)) || v[0];
      if (pick) { u.voice = pick; log('Uso la voce: ' + pick.name); } else log('Nessuna voce per ' + lang + ': uso quella predefinita');
    }
    u.onstart = () => log('▶ partita');
    u.onend = () => log('■ finita');
    u.onerror = e => log('⚠ errore: ' + e.error);
    keep.push(u);
    if (s.paused) s.resume();
    s.speak(u);
    log('… richiesta inviata (speaking=' + s.speaking + ', pending=' + s.pending + ')');
    setTimeout(() => log('dopo 2 s: speaking=' + s.speaking + ', pending=' + s.pending + ', paused=' + s.paused), 2000);
  }, 80);
}
document.getElementById('en').onclick = () => say('Hello, can you hear me?', 'en-GB', true);
document.getElementById('it').onclick = () => say('Ciao, mi senti?', 'it-IT', true);
document.getElementById('plain').onclick = () => say('Hello, can you hear me?', 'en-GB', false);
</script>
</body>
</html>
